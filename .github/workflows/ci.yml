name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.10.0

jobs:
  quality:
    name: Audit + Lint + TypeCheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (fail on moderate+)
        run: pnpm audit --audit-level=moderate

      - name: Type check (root + workspace packages)
        run: pnpm typecheck && pnpm --filter @yyc3/i18n-react typecheck

      - name: Lint (zero warnings)
        run: pnpm exec eslint src/ --max-warnings 0

      - name: CLI integration syntax gate
        run: pnpm --filter @yyc3/cli-integration check

      - name: Header/footer uniformity gate
        run: pnpm audit:headers

      - name: Build (root first, then workspace packages)
        run: pnpm build && pnpm --filter @yyc3/i18n-react build

      - name: Test with coverage (skills 脚本冒烟依赖 dist——build 前置于此)
        run: pnpm test:coverage

      - name: Exports contract gate (zero-deps + artifacts, post-build)
        run: pnpm audit:contract

      - name: Test @yyc3/i18n-react
        run: pnpm --filter @yyc3/i18n-react test

      - name: Bundle size gate
        run: pnpm size

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
