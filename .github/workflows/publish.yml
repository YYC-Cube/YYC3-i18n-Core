# npm 发版工作流 — Trusted Publishing (OIDC),零 token。
#
# 背景(2026-08-20 排查记录,详见 git log):
# - 本地网络对 registry.npmjs.org 大体积 PUT 断连(IPv4/IPv6 均然);
# - token 直接发布在 GitHub CI 亦 403(无正文,Cloudflare HTML 拦截页),
#   35 分钟冷却后单次重试依旧 → 持久性封锁,疑似多次失败触发的
#   滥用防护标记;lodash 对照证实账户/token 传输本身健康;
# - 按 npm 2026 政策的官方替代通道迁移 OIDC,绕开 token 认证维度。
#
# 启用前置(一次性,npmjs.com 网页操作):
#   npmjs.com → 包 @yyc3/i18n-core → Settings(或 Publishing)→
#   Trusted Publishing → Configure →
#     Repository owner: YYC-Cube
#     Repository name: YYC3-i18n-Core
#     Workflow filename: publish.yml
#     Environment: (留空)
#
# ⚠️ 失败后切勿立即重试——连续失败 PUT 会触发/延长 Cloudflare 熔断,
#   每次重试都会重新计时。至少间隔数小时。
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) 所需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      # OIDC trusted publishing 需要 npm >= 11.5(Node 22 自带 10.x)
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly(clean+build+test)由 npm publish 原生触发。
      # ⚠️ 某处(仓库/组织配置)会向步骤注入 NODE_AUTH_TOKEN secret,
      # npm 见 token 即优先 token 认证、跳过 OIDC——必须显式清除,
      # 迫使 npm ≥11.5 走 Trusted Publishing 的 OIDC 交换。
      - name: Publish
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ""
