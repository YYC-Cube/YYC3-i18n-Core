# npm 发版工作流 — CI 发版(本地网络对 registry 大上传不可用)。
# 依赖 repo secret NPM_TOKEN = 细粒度 token(Read and write +
# All packages + Bypass 2FA)。
# ⚠️ 排查教训(2026-08-20):对 registry 的连续失败 PUT 会触发
# Cloudflare 速率熔断(HTML 403 "Attention Required"),表现为无正文
# 的 E403,且与 token/客户端无关。失败后不要立即重试,等待冷却
# (~30-60 分钟)再单次重试。
# 2027-01 npm GAT 政策全面生效后,迁移 Trusted Publishing(OIDC):
# npmjs.com 包设置绑定本仓库,恢复 permissions.id-token: write +
# --provenance,去除 NPM_TOKEN。
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly(clean+build+test)由 npm publish 原生触发
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
