# npm 发版工作流 — Trusted Publishing (OIDC)。
# npm 2026 政策下 token 直接发布对该账户已不可用(本地与 CI 均 403、
# 无错误正文;认证层已通过),按官方替代通道改用 OIDC:
#   1. npmjs.com → @yyc3/i18n-core → Settings → Trusted Publishing
#      绑定 Repository: YYC-Cube/YYC3-i18n-Core, Workflow: publish.yml
#   2. 本工作流以 id-token: write 出示 OIDC 身份,无需任何 token。
# 若探针(Publish probe)已成功将版本放上 registry,publish 步骤会
# 识别"已发布"而不报错。
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm Trusted Publishing 所需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 诊断探针 v3:文档二分定位 WAF 触发内容
      # (manifest vs 附件;附件内部分四段替换)
      - name: Publish probe
        run: |
          npm pack --ignore-scripts >/dev/null 2>&1
          node scripts/probe-publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (Trusted Publishing / OIDC)
        run: |
          npm publish --access public --provenance || {
            v=$(npm view @yyc3/i18n-core version 2>/dev/null)
            if [ "$v" = "2.4.1" ]; then echo "already published by probe"; exit 0; fi
            echo '--- npm debug log ---'
            tail -n 80 /home/runner/.npm/_logs/*debug-0.log 2>/dev/null || true
            exit 1
          }
