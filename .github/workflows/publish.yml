# npm 发版工作流 — Trusted Publishing (OIDC),零 token。
#
# ⚠️ 当前阻塞(2026-08-20 确诊):`PUT /@yyc3/i18n-core` 被 npm 侧
# Cloudflare WAF 定点拦截("Attention Required" HTML 403)。已排除:
# 凭证(none/token/合法 OIDC 均拦)、网络(CN 本地/美国 runner)、npm
# 版本(10.9.8/11.17)、载荷(全文档/最小/哑弹/无 sourcemap)、注册
# (exchange 201 证实匹配)。唯一出路:npm support 解除,或长时间
# (24h+)完全静默后单次重试。**失败后绝不连发重试**——失败风暴正是
# 触发拦截的原因。
#
# 恢复发版时:移动 tag v* 到目标提交并推送即触发。
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) 所需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Node 24 自带 npm >= 11.5(OIDC 最低要求)
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/clean.npmrc"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          npm publish --access public --provenance
