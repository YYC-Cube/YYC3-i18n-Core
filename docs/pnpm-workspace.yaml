# VitePress 文档站为独立工作区(不入根 packages/*),
# 避免 pnpm 向上探测到根 pnpm-workspace.yaml;自带锁文件支持 CI frozen 安装
packages: []

allowBuilds:
  esbuild: true

overrides:
  # 供应链 24h 冷却策略:copy-anything@4.1.2 发布于 2026-09-25(锁文件生成当天),
  # 传递链 vitepress → @vue/devtools-kit → superjson@^4 → copy-anything;
  # 钉到 7 天前的 4.1.1(满足 superjson 的 ^4),4.1.2 冷却期满后可移除此覆盖
  copy-anything: "4.1.1"
  # 安全修复:audit 报 6 项(2 high 3 moderate 1 low)——vite ≤6.4.3(launch-editor
  # fs.existsSync 高危 / escapeCmdArgs % 转义 / CLI flag 误读 / server.fs.allow 越界 /
  # 跨域脚本执行,修复仅存在于 6.4.4+)与 source-map-js <1.2.2(事件循环 DoS,≥1.2.2 修复);
  # vitepress 1.6 peer 支持 ^5.4.0 || ^6,6.4.4 满足冷却合规
  vite: ^6.4.4
  source-map-js: ">=1.2.2"
